<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications chrétiennes</title>
<meta name="description" content="Jeux et applications autour de la Bible.">
<style>
:root { --bg: #f6f8fc; --ink: #0e1f3b; --muted: #4d5b74; --paper: #ffffff; --accent: #1f4e99; }
@media (prefers-color-scheme: dark) { :root { --bg: #0c1628; --ink: #e8edf7; --muted: #a8b4cb; --paper: #13203a; --accent: #8fb3f0; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Segoe UI", Arial, sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 18px; }
h1 { margin: 0; font-size: 28px; }
a.app { display: flex; gap: 14px; align-items: center; background: var(--paper); border-radius: 18px; padding: 14px 16px; text-decoration: none; color: inherit; box-shadow: 0 4px 16px rgba(14,31,59,.08); }
a.app img { width: 56px; height: 56px; border-radius: 14px; }
a.app strong { color: var(--accent); }
p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Nos applications</h1>
  <a class="app" href="parmi-le-peuple/">
    <img src="parmi-le-peuple/icone.png" alt="">
    <span><strong>Parmi le peuple</strong><br>Le jeu de bluff et de discernement autour de la Bible.</span>
  </a>
  <p>Contact : seraaphcompany@gmail.com</p>
</main>
</body>
</html>
